<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="신혼부부 공동 자산 관리 앱" />
  <title>우리 자산</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/apple.css" />
</head>
<body>
  <div id="app" class="app-shell"><p class="boot-loading">로딩 중…</p></div>
  <div id="modal-root"></div>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<div class="auth-screen" style="padding:24px"><h1>서버로 실행해 주세요</h1>' +
        '<p class="muted">index.html을 직접 열면 연결되지 않습니다.<br><br>' +
        '<strong>start-server.bat</strong> 실행 후<br>' +
        '<strong>http://localhost:8080</strong> 으로 접속하세요.</p></div>';
      throw new Error('file protocol');
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
