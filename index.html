<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1e4d3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="승재·은지 가계부 — 모바일" />
  <title>승재·은지 가계부</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="header">
      <div class="header-row">
        <button type="button" class="icon-btn" id="btn-prev-month" aria-label="이전 달">‹</button>
        <div class="header-titles">
          <h1 class="header-title" id="page-title">가계부</h1>
          <p class="header-sub" id="header-sub"></p>
        </div>
        <button type="button" class="icon-btn" id="btn-next-month" aria-label="다음 달">›</button>
      </div>
    </header>

    <main class="main" id="main"></main>

    <nav class="tab-bar" id="tab-bar" role="tablist">
      <button type="button" class="tab active" data-route="home" role="tab">
        <span class="tab-icon">🏠</span><span class="tab-label">홈</span>
      </button>
      <button type="button" class="tab" data-route="month" role="tab">
        <span class="tab-icon">📋</span><span class="tab-label">내역</span>
      </button>
      <button type="button" class="tab tab-fab" id="tab-add" aria-label="지출 추가">
        <span class="tab-fab-inner">+</span>
      </button>
      <button type="button" class="tab" data-route="assets" role="tab">
        <span class="tab-icon">💰</span><span class="tab-label">자산</span>
      </button>
      <button type="button" class="tab" data-route="more" role="tab">
        <span class="tab-icon">⋯</span><span class="tab-label">더보기</span>
      </button>
    </nav>
  </div>

  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
